# 맵리스 프로파일 오버레이 (go2_nav2_launch.py mapless:=true 시 추가 로드).
# 사전 제작 지도 없이 실시간 관측만으로 주행 — 야외 실기체 전이 형태와
# 일치 (야외는 사전 맵 확보 불가). 결정적 맵 프로파일(기본)은 회귀
# 평가용으로 유지, 이 파일은 전역 코스트맵만 rolling으로 뒤집는다.
#
# 한계 (시나리오 통합 시 후속):
# - goal은 rolling 창(30m) 안이어야 함 — 원거리는 웨이포인트 분할
# - 보도 경계가 코스트맵에 없음 (연석 0.16m는 지면 필터에 걸러짐) —
#   보도 이탈 방지는 sidewalk_polygon → costmap keepout 주입이 필요
global_costmap:
  global_costmap:
    ros__parameters:
      rolling_window: True
      width: 30
      height: 30
      plugins: ["obstacle_layer", "inflation_layer"]
      # 미관측 = free (낙관적) — 정적 레이어 없이 전방 계획 가능하게
      track_unknown_space: false

planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
