# Nav2 런치 전용 override (v2): 인지+YIELD 상태기계는 유지, 조향 주입만
# OFF. v1(전체 OFF)에서는 대면 보행자에 양보가 없어 코스트맵의 정지 세계
# 가정(속도 미인지)만으로 대응 — 정면 접근에서 게이트 STOP만 남는 문제.
# YIELD_MOVE/WAIT는 STUCK처럼 출력 인수형이라 Nav2 명령과 충돌하지 않고,
# 통과 후 RESUME되면 Nav2가 새 위치에서 재계획한다.
safety_stop_node:
  ros__parameters:
    social_enable: true
    social_steering: false
