# Self-filter box in base_link frame.
# L1 LiDAR min range (0.8m) already removes most of the robot body,
# but this is the safety-net cutoff applied after TF→base_link.
lidar_obstacle_node:
  ros__parameters:
    # ROI crop (forward obstacle zone)
    roi_x_min: 0.5
    roi_x_max: 8.0
    roi_y_min: -3.0
    roi_y_max: 3.0
    roi_z_min: -0.3
    roi_z_max: 0.5   # 로봇 키(~0.4m) 위 구조물(나뭇가지/표지판) 제외

    # Self-filter box (base_link frame). Wider than physical body.
    self_x_min: -0.40
    self_x_max:  0.40
    self_y_min: -0.30
    self_y_max:  0.30
    self_z_min: -0.50
    self_z_max:  0.25

    # Ground removal threshold in base_link frame
    ground_z: -0.05

    # Voxel downsampling resolution (m)
    voxel_size: 0.10

    # Clustering (grid-based BFS in 2D)
    cluster_grid: 0.20
    cluster_min_points: 4

    # Topics
    points_topic: /unitree_lidar/points
    target_frame: base_link
    output_topic: /obstacles/lidar

    # Publish rate cap (Hz)
    publish_rate: 10.0
