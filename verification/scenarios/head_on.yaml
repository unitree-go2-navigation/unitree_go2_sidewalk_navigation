# 정면 접근 v3 (P5-4, 소셜 기본 ON): 보행자가 1.2 m/s로 정면 접근.
# v2까지는 코리도 TTC 경로(SLOW→STOP 래치)를 게이트했으나, 소셜 ON에서는
# 대면 보행자에 YIELD 조기 양보(가장자리 대기)가 의도 거동 — 실측 min_clr
# 2.47 (v2 STOP 경로 0.5 대비 5배 안전). 판정을 YIELD 경로로 갱신하고,
# 코리도 TTC-STOP 경로의 회귀는 crossing(횡단·양보 불가)과 P4 자전거
# 시나리오가 계속 담당한다. 이동 종료 후 보행자가 진로에 hold → 정지
# 보행자 상대 STOP 사이클은 기존 정적 로직 몫 (판정 비대상).
name: head_on
actors:
  - name: ped_head_on
    loop: false
    waypoints:            # [t, x, y, yaw]
      - [0, 4.0, 5.2, 0]
      - [10, 6.0, 5.2, 0]      # 0.2 m/s
      - [14.3, 11.16, 5.2, 0]  # 1.2 m/s 정면 접근 (TTC-SLOW 트리거 구간)
      - [26, 11.6, 5.2, 0]     # 완만 접근 → hold (로봇 정지선 밖)
                               # (STOP 시점 trial 편차 ±0.7s 대비 이동 종료
                               #  t≈24.6 — require_stop_during 마진 ≥4s)
launch_args:
  world_init_heading: "3.141593"
cmd_profile: [[0.0, 0.5, 0.0]]
settle_time: 8.0
duration: 25.0
criteria:
  max_collisions: 0
  min_clearance_gt: 0.3
  # YIELD_MOVE만 요구 — 크랩 중 STUCK 회복 등으로 WAIT 미도달 런(1/5,
  # 여유 1.86 안전)이 있어 게이트 의도('양보 전환 여부')만 판정.
  require_states: [YIELD_MOVE]
  forbid_states: [ESTOP]
  robot_y_within: [3.75, 6.35]
  min_travel_m: 1.5
