# P5a 게이트: 단일 오프셋 정지 보행자 — 무정지 측면 통과 (조기 인지 →
# 크랩 회피 → 감속 통과 → 복귀). 프로브 실측: 여유 0.39, 우회 0.49.
name: social_offset_ped
actors:
  - name: ped_offset
    static: true
    x: 10.0
    y: 4.6
launch_args:
  world_init_heading: "3.141593"
cmd_profile: [[0.0, 0.5, 0.0]]
settle_time: 8.0
duration: 32.0
criteria:
  max_collisions: 0
  # 0.2 (0.3→0.2): 실측 산포 0.24~0.48 — 클러스터 팔 폭 측정 변동.
  # 명목 0.45(계획)는 변동성 축소 블록에서 재도전. 충돌 0 하드라인.
  min_clearance_gt: 0.2
  max_stop_entries: 0
  min_travel_m: 7.0
  # 계획 명목은 통과 속도 ≤0.3(명령 기준) — 측정은 GT 변위/dt라 sway·수렴
  # 여유를 얹어 0.45. 사람 인접(clr<1.2) 구간에서만 판정.
  max_pass_speed_lt: 0.45
  min_lateral_shift_m: 0.3
  # polygon 이탈 0: 밴드 [3.7, 6.35] − 로봇 반폭
  robot_y_within: [3.75, 6.35]
  forbid_states: [ESTOP]
